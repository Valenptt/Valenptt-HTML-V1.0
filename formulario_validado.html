<!DOCTYPE html>
<html>
<head>
    <title>Formulario Validado</title>
    <link rel="stylesheet" href="estilos_formulario.css">
</head>

<body>

<div class="contenedor">
    <h2>Registro de Usuario</h2>

    <form>

        <label>Nombre:</label>
        <input type="text" name="nombre" required pattern="[A-Za-z ]+">

        <label>Apellido:</label>
        <input type="text" name="apellido" required pattern="[A-Za-z ]+">

        <label>Fecha de nacimiento:</label>
        <input type="date" name="fecha" required>

        <label>Teléfono:</label>
        <input type="tel" name="telefono" required pattern="[0-9]{10}">

        <label>Correo electrónico:</label>
        <input type="email" name="correo" required>

        <label>Experiencia:</label>
        <textarea name="experiencia" rows="4" required></textarea>

        <input type="submit" value="Enviar">

    </form>
</div>

</body>
</html>
